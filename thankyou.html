<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family: Georgia, "Times New Roman", serif;

    color: white;

    background:
        radial-gradient(
            circle at center,
            #591044 0%,
            #26001f 45%,
            #050005 100%
        );
}


/* BACKGROUND */

.background-text {
    position: fixed;
    inset: -100px;

    display: flex;
    flex-wrap: wrap;

    justify-content: center;
    align-content: center;

    gap: 30px 45px;

    transform: rotate(-10deg) scale(1.2);

    opacity: 0.07;

    pointer-events: none;

    z-index: 0;
}

.background-text span {
    color: #ff69c9;

    font-family: Arial, sans-serif;

    font-size: 28px;

    font-weight: bold;

    white-space: nowrap;
}


/* GLOW */

.glow {
    position: fixed;

    width: 600px;
    height: 600px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(255, 60, 180, 0.22),
            transparent 70%
        );

    filter: blur(40px);

    pointer-events: none;

    z-index: 0;
}


/* HEARTS */

.heart {
    position: fixed;

    bottom: -50px;

    color: #ff4db8;

    font-size: 25px;

    pointer-events: none;

    z-index: 2;

    text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493;

    animation: floatHeart 9s linear infinite;
}

@keyframes floatHeart {

    0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-120vh) scale(1.3);
        opacity: 0;
    }
}


/* MAIN */

.container {
    position: relative;

    z-index: 5;

    width: 100%;

    min-height: 100vh;

    padding: 50px 20px 120px;
}


/* TITLE */

.title {
    text-align: center;

    font-family: Arial, sans-serif;

    font-size: clamp(45px, 8vw, 85px);

    font-weight: 900;

    color: #ffd5ef;

    text-shadow:
        0 0 10px #ff69c9,
        0 0 25px #ff1493,
        0 0 50px #ff1493;

    animation: titleIn 2s ease;
}

@keyframes titleIn {

    0% {
        opacity: 0;
        transform: scale(0.6);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}


/* SUBTITLE */

.subtitle {
    text-align: center;

    margin: 15px auto 50px;

    max-width: 700px;

    font-family: Arial, sans-serif;

    font-size: clamp(18px, 3vw, 25px);

    color: #ffb5e8;

    font-style: italic;
}


/* LETTER */

.letter {
    width: min(850px, 94vw);

    margin: auto;

    padding: clamp(30px, 6vw, 65px);

    border-radius: 25px;

    background: rgba(255,255,255,0.07);

    border: 1px solid rgba(255,160,220,0.45);

    backdrop-filter: blur(12px);

    box-shadow:
        0 0 25px rgba(255,20,147,0.25),
        0 0 70px rgba(255,20,147,0.12);

    transform-origin: center top;

    animation: letterZoom 10s ease-in-out infinite alternate;
}

@keyframes letterZoom {

    0% {
        transform: scale(0.98);
    }

    100% {
        transform: scale(1.015);
    }
}


/* LETTER TEXT */

.letter-content {
    font-size: clamp(18px, 3vw, 25px);

    line-height: 2;

    color: #fff3fb;
}

.line {
    min-height: 1.8em;

    margin-bottom: 25px;
}


/* CURSOR */

.cursor {
    display: inline-block;

    width: 3px;
    height: 1em;

    margin-left: 3px;

    background: #ff69c9;

    vertical-align: middle;

    animation: blink 0.7s infinite;
}

@keyframes blink {

    50% {
        opacity: 0;
    }
}


/* SIGNATURE */

.signature {
    margin-top: 45px;

    text-align: right;

    font-size: clamp(22px, 4vw, 34px);

    color: #ffb5e8;

    opacity: 0;

    transition: opacity 2s ease;
}

.signature.show {
    opacity: 1;
}


/* FINAL MESSAGE */

.final-message {
    margin: 100px auto 0;

    text-align: center;

    font-family: Arial, sans-serif;

    font-size: clamp(28px, 6vw, 55px);

    font-weight: bold;

    color: #ffd5ef;

    text-shadow:
        0 0 10px #ff69c9,
        0 0 30px #ff1493,
        0 0 60px #ff1493;

    opacity: 0;

    transform: scale(0.8);

    transition: all 2s ease;
}

.final-message.show {
    opacity: 1;

    transform: scale(1);
}


/* BACK BUTTON */

.back {
    display: block;

    width: fit-content;

    margin: 60px auto 0;

    padding: 13px 30px;

    border-radius: 40px;

    text-decoration: none;

    color: white;

    font-family: Arial, sans-serif;

    font-weight: bold;

    background: rgba(255,50,170,0.18);

    border: 1px solid #ff65c7;

    box-shadow:
        0 0 12px rgba(255,20,147,0.5);

    transition: 0.3s ease;
}

.back:hover {
    background: #ff299f;

    transform: scale(1.07);

    box-shadow:
        0 0 20px #ff1493,
        0 0 40px #ff1493;
}


/* MOBILE */

@media (max-width: 600px) {

    .container {
        padding: 30px 12px 100px;
    }

    .title {
        font-size: 43px;
    }

    .subtitle {
        font-size: 18px;

        margin-bottom: 30px;
    }

    .letter {
        padding: 28px 20px;

        border-radius: 20px;
    }

    .letter-content {
        font-size: 18px;

        line-height: 1.9;
    }

    .line {
        margin-bottom: 22px;
    }

    .signature {
        text-align: center;

        font-size: 24px;
    }

    .background-text span {
        font-size: 20px;
    }
}

</style>

</head>

<body>


<!-- BACKGROUND TEXT -->

<div class="background-text">

    <span>Thank You ❤️</span>
    <span>Thank You ❤️</span>
    <span>Thank You ❤️</span>
    <span>Thank You ❤️</span>
    <span>Thank You ❤️</span>
    <span>Thank You ❤️</span>
    <span>Thank You ❤️</span>
    <span>Thank You ❤️</span>
    <span>Thank You ❤️</span>
    <span>Thank You ❤️</span>

</div>


<div class="glow"></div>


<!-- FLOATING HEARTS -->

<div class="heart" style="left:8%; animation-delay:0s;">♥</div>
<div class="heart" style="left:22%; animation-delay:2s;">♥</div>
<div class="heart" style="left:40%; animation-delay:4s;">♥</div>
<div class="heart" style="left:62%; animation-delay:1s;">♥</div>
<div class="heart" style="left:82%; animation-delay:3s;">♥</div>


<!-- MAIN -->

<div class="container">

    <h1 class="title">
        Thank You ❤️
    </h1>

    <div class="subtitle">
        A few words that I wanted to say...
    </div>


    <!-- LETTER -->

    <div class="letter">

        <div
            class="letter-content"
            id="letterContent">
        </div>


        <div
            class="signature"
            id="signature">

            Always keep smiling ❤️

        </div>

    </div>


    <!-- FINAL -->

    <div
        class="final-message"
        id="finalMessage">

        Thank You For Everything ❤️

        <br>

        Happy Birthday 🎂✨

    </div>


    <a
        href="menu.html"
        class="back">

        ← Back to Menu

    </a>

</div>


<script>

/* =========================================
   THANK YOU LETTER
========================================= */

const letterLines = [

    "Thank you. ❤️",

    "Thank you for every smile, every laugh, and every little moment that became a beautiful memory.",

    "Thank you for all the conversations, the fun moments, and even the random little things that made the days more special.",

    "There are so many memories that are impossible to forget.",

    "Some moments were funny, some were unexpected, and some were simply special.",

    "But every single one of them is something worth remembering.",

    "I hope you always remember the good times and the little things that made you smile.",

    "I hope you keep making amazing memories wherever life takes you.",

    "I hope you get everything you wish for and achieve everything you work for.",

    "You deserve plenty of happiness, countless smiles, and many beautiful moments ahead.",

    "So today, on your birthday, I just want to say thank you for all the memories.",

    "Thank you for being someone who made so many moments worth remembering.",

    "Thank you for all the smiles.",

    "Thank you for all the laughs.",

    "Thank you for all the memories.",

    "And most importantly, thank you for being you. ❤️"

];


/* =========================================
   SETTINGS
========================================= */

const typingSpeed = 35;

const lineDelay = 700;


/* =========================================
   ELEMENTS
========================================= */

const letterContent =
    document.getElementById("letterContent");

const signature =
    document.getElementById("signature");

const finalMessage =
    document.getElementById("finalMessage");


/* =========================================
   TYPING
========================================= */

function typeLine(text, callback) {

    const line =
        document.createElement("div");

    line.className = "line";

    letterContent.appendChild(line);


    let index = 0;


    const cursor =
        document.createElement("span");

    cursor.className = "cursor";

    line.appendChild(cursor);


    const typing =
        setInterval(() => {

            if (index < text.length) {

                cursor.before(
                    document.createTextNode(
                        text[index]
                    )
                );

                index++;

            } else {

                clearInterval(typing);

                cursor.remove();

                setTimeout(
                    callback,
                    lineDelay
                );
            }

        }, typingSpeed);

}


/* =========================================
   TYPE ALL LINES
========================================= */

let currentLine = 0;


function typeNextLine() {

    if (currentLine < letterLines.length) {

        typeLine(
            letterLines[currentLine],
            () => {

                currentLine++;

                typeNextLine();

            }
        );

    } else {

        signature.classList.add("show");

        setTimeout(() => {

            finalMessage.classList.add("show");

        }, 1500);

    }

}


/* =========================================
   AUTO SCROLL
========================================= */

let scrolling = false;


function startAutoScroll() {

    scrolling = true;

    const scrollSpeed = 0.35;


    function scrollPage() {

        if (!scrolling) return;


        window.scrollBy(
            0,
            scrollSpeed
        );


        requestAnimationFrame(
            scrollPage
        );

    }


    requestAnimationFrame(
        scrollPage
    );

}


/* =========================================
   START
========================================= */

setTimeout(() => {

    typeNextLine();

    setTimeout(
        startAutoScroll,
        3000
    );

}, 1200);


/* =========================================
   STOP WHEN USER SCROLLS
========================================= */

window.addEventListener(
    "touchstart",
    () => {

        scrolling = false;

    },
    { passive: true }
);


window.addEventListener(
    "wheel",
    () => {

        scrolling = false;

    },
    { passive: true }
);

</script>


</body>

</html>
